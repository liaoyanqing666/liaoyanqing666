<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">GitHub metrics placeholder</title>
  <desc id="desc">This image will be replaced automatically by GitHub Actions.</desc>
  <rect width="900" height="220" fill="#0d1117"/>
  <rect x="20" y="20" width="860" height="180" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="78" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">
    GitHub metrics will appear here
  </text>
  <text x="40" y="120" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    After you add the METRICS_TOKEN secret and run the workflow once,
  </text>
  <text x="40" y="150" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    this placeholder will be replaced by a generated local SVG.
  </text>
</svg>
